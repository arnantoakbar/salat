<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji panggung 3D — alat setel pose (bukan bagian situs)</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/app.css">
<style>
  .uji { max-width: 560px; margin: 20px auto; padding: 0 16px; }
  .uji-tombol { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .uji-tombol button { border: 1px solid var(--border-default); border-radius: 8px; padding: 6px 10px; font-size: 12px; background: #fff; }
  .uji-tombol button:hover { border-color: var(--color-flame); }
</style>
</head>
<body>
<script src="js/sprite.js"></script>
<div class="uji">
  <div class="panggung" id="panggung">
    <div class="panggung-label">
      <span class="panggung-nama" id="nama">Uji pose</span>
      <span class="panggung-tahap" id="tahap"></span>
    </div>
    <div class="panggung-gagal">WebGL tidak tersedia di peramban ini.</div>
  </div>
  <div class="uji-tombol" id="poseBtn"></div>
  <div class="uji-tombol" id="sorotBtn"></div>
  <div class="uji-tombol">
    <button onclick="UJI.takbir('bahu')">▶ takbir (bahu)</button>
    <button onclick="UJI.takbir('telinga')">▶ takbir (telinga)</button>
    <button onclick="UJI.takbir('sadl')">▶ takbir (maliki/sadl)</button>
  </div>
</div>

<script src="js/vendor/three.min.js"></script>
<script>
// Alat uji ini dipakai saat menyetel pose, jadi berkasnya harus selalu
// dimuat ulang — bukan versi lama dari singgahan peramban.
(function () {
  var t = Date.now();
  ['rig', 'pose', 'kamera', 'viewer'].forEach(function (n) {
    document.write('<script src="js/tiga/' + n + '.js?t=' + t + '"><\/script>');
  });
})();
</script>
<script>
(function () {
  var v = VIEWER.buat(document.getElementById('panggung'), {
    simpanBuffer: true,
    onTahap: function (i, l) {
      document.getElementById('tahap').textContent = l.tahap || l.pose;
    }
  });

  window.UJI = {
    v: v,
    pose: function (nama) {
      v.setLangkah([{ pose: nama, gerak: 600, tahan: 999999, tahap: nama }]);
    },
    sorot: function (nama) { v.kamera.sorot(nama); },
    // Setel sudut sendi langsung (derajat) untuk mencari angka pose.
    sudut: function (sendi, x, y, z) {
      v.setJalan(false);
      v.rig.sendi[sendi].rotation.set(x * Math.PI / 180, y * Math.PI / 180, z * Math.PI / 180);
    },
    akar: function (x, y, z) { v.setJalan(false); v.rig.sendi.akar.position.set(x, y, z); },
    // Memaksa frame maju tanpa requestAnimationFrame — dipakai saat panel
    // pratinjau disembunyikan sehingga loop dijeda otomatis.
    tick: function (ms, kali) { return v.majuFrame(ms || 60, kali || 20); },
    // Titik dunia sendi penting — dipakai menyetel pose secara terukur
    // (mis. dahi dan telapak harus menyentuh lantai saat sujud).
    titik: function () {
      var out = {}, w = new THREE.Vector3();
      v.scene.updateMatrixWorld(true);
      ['kepala','tanganKa','tanganKi','lututKa','kakiKa','akar','dada','bahuKa'].forEach(function (n) {
        v.rig.sendi[n].getWorldPosition(w);
        out[n] = [+w.x.toFixed(3), +w.y.toFixed(3), +w.z.toFixed(3)];
      });
      return JSON.stringify(out);
    },
    takbir: function (varian) {
      var angkat = varian === 'telinga' ? 'angkat-telinga' : 'angkat-bahu';
      var akhir = varian === 'sadl' ? 'berdiri' :
        varian === 'telinga' ? 'sedekap-bawah-pusar' : 'sedekap-atas-pusar';
      v.setJalan(true);
      v.setLangkah([
        { pose: 'berdiri', gerak: 700, tahan: 900, tahap: 'Berdiri tegak' },
        { pose: angkat, gerak: 650, tahan: 1200, tahap: 'Allahu akbar', sorot: 'atas-badan' },
        { pose: akhir, gerak: 700, tahan: 1700, tahap: varian === 'sadl' ? 'Tangan lurus (sadl)' : 'Bersedekap' }
      ], 'atas-badan');
    }
  };

  var poses = Object.keys(POSE.POSES);
  var wadah = document.getElementById('poseBtn');
  poses.forEach(function (p) {
    var b = document.createElement('button');
    b.textContent = p;
    b.onclick = function () { UJI.pose(p); };
    wadah.appendChild(b);
  });
  var sorot = document.getElementById('sorotBtn');
  Object.keys(KAMERA.SOROTAN).forEach(function (s) {
    var b = document.createElement('button');
    b.textContent = '📷 ' + s;
    b.onclick = function () { UJI.sorot(s); };
    sorot.appendChild(b);
  });

  UJI.takbir('bahu');
})();
</script>
</body>
</html>
